name: Deploy storm markers above rainfall
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/storm-placement.yml']
permissions:
  contents: read
concurrency:
  group: gfs-krosno-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check weather frontend
        run: |
          node --check site/app.js
          node tests/test_weather_frontend.cjs
      - name: Back up and deploy verified storm marker placement
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_storm_placement.py
