name: GFS Krosno – prognoza i konwekcja
on:
  workflow_call:
  schedule:
    - cron: '35 2,4,6,8,10,11,16,17,22 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfs-krosno-publish
  cancel-in-progress: false
jobs:
  run-gfs:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      FTP_HOST: corn.cba.pl
      FTP_USER: nemexia
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_SITE_ASSETS_DIR: /meteo-krosno.pl/wp-content/themes/meteo-krosno-modern/assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install 'numpy<3' 'pandas<3' 'matplotlib<4' requests xlsxwriter python-dotenv eccodes metpy
      - name: Test GFS and convection
        run: python -m unittest discover -s tests -p test_gfs_weather.py -v
      - name: Select shared run
        run: python -c "import gfs_krosno as g,os; d,h=g.select_run(); open(os.environ['GITHUB_ENV'],'a').write('GFS_RUN='+d+h+'\n')"
      - name: Run GFS forecast with separate extended files
        run: python gfs_krosno.py --run "$GFS_RUN" --max-wait 60
      - name: Run GFS convection on the same downloaded data
        run: python gfs_conv.py --run "$GFS_RUN" --reuse-gribs
