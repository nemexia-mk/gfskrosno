name: Deploy cloud base and visibility panel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloud-panel.yml']
permissions:
  contents: read
concurrency:
  group: gfs-krosno-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check weather frontend and cloud rendering
        run: |
          node --check site/app.js
          node tests/test_weather_frontend.cjs
          node tests/test_meteorogram_clouds.cjs
      - name: Back up and deploy cloud panel
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_cloud_panel.py
