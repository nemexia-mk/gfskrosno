name: Deploy meteorogram chart scales
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/chart-styles.yml']
permissions:
  contents: read
concurrency:
  group: gfs-krosno-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify meteorogram rendering and data
        run: |
          node --check site/app.js
          node tests/test_weather_frontend.cjs
          node tests/test_meteorogram_clouds.cjs
          node tests/test_meteorogram_styles.cjs
      - name: Back up and deploy chart styles
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_chart_styles.py
