name: Inspect weather asset cache
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/weather-assets.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect asset version and cache
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/inspect_weather_assets.py
