name: METMOD – dobowe dane Krosno

on:
  schedule:
    - cron: '45 8,14 * * *' # UTC; drugi odczyt uzupełnia opóźnione dane
  workflow_dispatch:

concurrency:
  group: metmod-zbiorczy-csv
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Test parser and safe CSV publication
        run: python -m unittest discover -s tests -v
      - name: Update last seven days without duplicates
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python metmod.py --lookback 7
