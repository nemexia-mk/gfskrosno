name: GFS Krosno – auto run

on:
  schedule:
    - cron: "45 8 * * *"  # codziennie o 3:00 rano
  workflow_dispatch:        # umożliwia ręczne uruchomienie z GitHuba

jobs:
  run-gfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas
          pip install python-dotenv
      - name: Run METMOD script
        env:
          FTP_HOST: "corn.cba.pl"
          FTP_USER: "nemexia"
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python metmod.py
# Update workflow
