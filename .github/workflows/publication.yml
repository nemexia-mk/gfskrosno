name: Publish HTTPS, privacy and live humidity fixes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publication.yml', 'site/mu-plugins/mk-publication.php', 'site/mu-plugins/mk-publication-policy.php', 'site/publication-assets/**', 'tools/deploy_publication.py', 'tools/verify_publication.py', 'tests/test_publication.php', 'tests/test_consent.cjs']
permissions:
  contents: read
concurrency:
  group: meteo-krosno-public-seo-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Test sensor mapping, privacy gates, HTML and SEO
        run: |
          php -l site/mu-plugins/mk-publication.php
          php -l site/mu-plugins/mk-publication-policy.php
          php -l site/mu-plugins/mk-public-seo.php
          php tests/test_publication.php
          php tests/test_public_seo.php
          php tests/test_sitemap_cache.php
          node --check site/publication-assets/consent-20261029.js
          node tests/test_consent.cjs
          python -m py_compile tools/deploy_publication.py tools/verify_publication.py
      - name: Privately back up and apply reviewed publication changes
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_publication.py
      - name: Verify redirects, privacy UI, removal, image links and humidity
        run: python tools/verify_publication.py
