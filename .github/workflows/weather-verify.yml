name: Verify GFS and convection
on:
  workflow_dispatch:
  push:
    branches: [weather-upgrade-20261022]
    paths: ['gfs_krosno.py', 'gfs_conv.py', 'tests/test_gfs_weather.py', '.github/workflows/weather-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install GFS dependencies
        run: pip install 'numpy<3' 'pandas<3' 'matplotlib<4' requests xlsxwriter python-dotenv eccodes metpy
      - name: Unit and GRIB regression tests
        run: python -m unittest discover -s tests -p test_gfs_weather.py -v
      - name: Frontend data joins and syntax
        run: |
          node --check site/app.js
          node tests/test_weather_frontend.cjs
      - name: Select one consistent run
        run: python -c "import gfs_krosno as g,os; d,h=g.select_run(); open(os.environ['GITHUB_ENV'],'a').write('GFS_RUN='+d+h+'\n')"
      - name: Real NOAA download and legacy plus extra outputs without FTP
        run: python gfs_krosno.py --run "$GFS_RUN" --hours 0,1,2,3,6,12,24,72,120,123,384 --no-ftp --skip-previous --max-wait 12
      - name: Run convection on same actual NOAA data without FTP
        run: python gfs_conv.py --run "$GFS_RUN" --hours 0,1,2,3,6,12,24,72,120,123,384 --reuse-gribs --no-ftp
      - name: Verify extended fields
        run: python tools/verify_weather_outputs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-verification
          path: |
            gfs_krosno_full/*.json
            gfs_krosno_full/*.csv
            gfs_krosno_conv/*.csv
          retention-days: 7
