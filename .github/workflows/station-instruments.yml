name: Publish station windsock, rain cup and wind rose
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/station-instruments.yml']
permissions:
  contents: read
concurrency:
  group: meteo-krosno-ui-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate station instruments and wind aggregation
        run: |
          node --check station-dashboard/assets/dashboard.js
          node station-dashboard/tests/instruments.cjs
          php -l station-dashboard/mu-plugins/mk-station-wind-analytics.php
          php station-dashboard/tests/wind.php
          python -m py_compile tools/deploy_station_instruments.py
      - name: Back up public assets and publish station instruments
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_station_instruments.py
