name: Verify live weather deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/weather-check.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: gfs-krosno-publish
  cancel-in-progress: false
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install 'numpy<3' 'pandas<3' 'matplotlib<4' requests xlsxwriter python-dotenv eccodes metpy
      - uses: actions/download-artifact@v4
        with:
          name: weather-deployment-report
          run-id: 39825913675
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Verify complete forecast and convection parameters
        run: python tools/verify_weather_outputs.py
      - name: Verify both server scripts, website code, CSV bytes and schema
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_weather.py verify
