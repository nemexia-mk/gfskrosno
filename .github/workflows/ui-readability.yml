name: Publish UI readability and local time fixes
# Refresh static station asset version for browser caches.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ui-readability.yml']
permissions:
  contents: read
concurrency:
  group: meteo-krosno-ui-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax, time zones and precipitation intervals
        run: |
          node --check site/app.js
          node --check site/station-live.js
          node tests/test_ui_local_time.cjs
          node tests/test_weather_frontend.cjs
          node tests/test_meteorogram_clouds.cjs
          node tests/test_meteorogram_styles.cjs
          python -m py_compile tools/deploy_ui_readability.py
      - name: Back up and publish reviewed UI assets
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_ui_readability.py
