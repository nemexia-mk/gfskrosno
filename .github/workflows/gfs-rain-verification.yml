name: Publish GFS and IMGW verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gfs-rain-verification.yml', 'site/mu-plugins/mk-gfs-rain-verification.php', 'site/mu-plugins/mk-gfs-imgw-verification.php', 'tools/deploy_gfs_rain.py', 'tests/test_gfs_imgw_verification.php', 'tests/test_gfs_rain_verification.php', 'tests/test_gfs_rain_ui.cjs']
permissions:
  contents: read
concurrency:
  group: meteo-krosno-ui-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify rain periods, scores, collection and frontend regressions
        run: |
          php -l site/mu-plugins/mk-gfs-rain-verification.php
          php -l site/mu-plugins/mk-gfs-imgw-verification.php
          php tests/test_gfs_imgw_verification.php
          php tests/test_gfs_rain_verification.php
          node --check site/app.js
          node tests/test_gfs_rain_ui.cjs
          node tests/test_ui_local_time.cjs
          node tests/test_weather_frontend.cjs
          node tests/test_meteorogram_clouds.cjs
          node tests/test_meteorogram_styles.cjs
          python -m py_compile tools/deploy_gfs_rain.py
      - name: Back up, publish and verify both rain APIs and the temperature API
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_gfs_rain.py
