name: Smooth home page loading
on:
  push:
    branches: [main]
    paths: ['.github/workflows/home-loading.yml', 'site/mu-plugins/mk-home-loading.*', 'tools/deploy_home_loading.py', 'tests/home-loading.*']
permissions:
  contents: read
concurrency:
  group: meteo-krosno-public-seo-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Check early rendering and recovery
        run: |
          php -l site/mu-plugins/mk-home-loading.php
          php tests/home-loading.php
          node --check site/mu-plugins/mk-home-loading.js
          node tests/home-loading.cjs
          python -m py_compile tools/deploy_home_loading.py
      - name: Back up privately and publish only the loading module
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_home_loading.py
      - name: Check both public protocols and unchanged basic content
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          for protocol in ['http','https']:
              with urlopen(protocol+'://meteo-krosno.pl/',timeout=45) as r:
                  html=r.read().decode('utf-8')
                  assert r.status==200
                  assert html.count('id="mk-home-loader"')==1
                  assert 'mk-home-loading-style' in html
                  assert 'mk-seo-content' in html and '<h1>Pogoda w Krośnie</h1>' in html
                  print(protocol, '200: loader and basic content verified')
          PY
