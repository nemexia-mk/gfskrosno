name: Publish Meteo Krosno Android 1.0.0
on:
  push:
    branches: [main]
    paths: ['public-app/**', 'tools/deploy_android_release.py', 'tests/android-release.php', '.github/workflows/android-release.yml']
permissions:
  contents: read
concurrency:
  group: meteo-krosno-public-seo-publish
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Validate page and signed public APK
        run: |
          php -l public-app/mk-android-release.php
          php tests/android-release.php
          python -m py_compile tools/deploy_android_release.py
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs public-app/Meteo-Krosno-1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging public-app/Meteo-Krosno-1.0.0.apk > /tmp/apk-badging.txt
          python - <<'PY'
          from pathlib import Path
          import subprocess
          b=Path('/tmp/apk-badging.txt').read_text()
          assert "name='pl.meteokrosno.app' versionCode='13' versionName='1.0.0'" in b
          assert 'application-debuggable' not in b
          print('Public 1.0.0, code 13, non-debuggable verified')
          PY
      - name: Publish only APK and app information module
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_android_release.py
      - name: Verify public page, sitemap and exact downloaded APK bytes
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path('public-app/mk-android-release.json').read_text())
          base='https://meteo-krosno.pl'
          with urlopen(base+'/aplikacja/',timeout=45) as f:
              h=f.read().decode();assert f.status==200
              assert '<h1>Aplikacja Meteo Krosno</h1>' in h
              assert r['url'] in h and '/assets/app.js' not in h
              assert 'name="robots" content="index,follow' in h
              assert 'href="https://meteo-krosno.pl/aplikacja/"' in h
          with urlopen(base+r['url'],timeout=45) as f:
              b=f.read();assert f.status==200
              assert len(b)==r['bytes'] and hashlib.sha256(b).hexdigest()==r['sha256']
              print('Downloaded APK MIME:',f.headers.get('Content-Type'))
          with urlopen(base+'/',timeout=45) as f:
              h=f.read().decode();assert 'id="mk-android-promo"' in h and r['url'] in h
          with urlopen(base+'/page-sitemap.xml',timeout=45) as f:assert base+'/aplikacja/' in f.read().decode()
          print('Public app page 200, SEO, homepage download and exact APK verified')
          PY
