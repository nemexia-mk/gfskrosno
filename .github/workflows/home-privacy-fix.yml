name: Fix duplicate frame promotions and privacy link
on:
  push:
    branches: [main]
    paths: ['ui-fixes/**', 'tools/deploy_home_privacy_fix.py', '.github/workflows/home-privacy-fix.yml', 'site/publication-assets/consent-20261029.js', 'tests/test_consent.cjs']
permissions:
  contents: read
concurrency:
  group: meteo-krosno-home-privacy-repair
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: |
          php -l public-app/mk-android-release.php
          php -l site/mu-plugins/mk-buycoffee.php
          node tests/test_consent.cjs
          python -m py_compile tools/deploy_home_privacy_fix.py tools/deploy_android_release.py
      - env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_home_privacy_fix.py
      - run: |
          python - <<'PY'
          from urllib.request import urlopen
          base='https://meteo-krosno.pl'
          for suffix in ['','?mk_station_frame=turaszowka&mk_station_home=1']:
              with urlopen(base+'/'+suffix,timeout=45) as f: h=f.read().decode()
              if suffix: assert 'id="mk-android-promo"' not in h and 'id="mk-coffee-support"' not in h
              else: assert h.count('id="mk-android-promo"')==1 and h.count('id="mk-coffee-support"')==1
          with urlopen(base+'/aplikacja/',timeout=45) as f:
              assert 'consent-20261029.js?v=20261030-click' in f.read().decode()
          print('One outer promo pair, no frame promos, updated privacy handler verified')
          PY
