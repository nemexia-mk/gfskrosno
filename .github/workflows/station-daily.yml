name: Repair station CSV reader and add daily snapshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/station-daily.yml', 'station-daily/**', 'tools/deploy_station_daily.py']
permissions:
  contents: read
concurrency:
  group: meteo-krosno-public-seo-publish
  cancel-in-progress: false
jobs:
  repair-station-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Verify daily rotation and malformed timestamps on PHP 8.4
        run: |
          php -l station-daily/daily-cache.php
          php station-daily/test.php
          php -l station-daily/reader-fixture.php
          python -m py_compile tools/deploy_station_daily.py
      - name: Back up privately, repair CSV parsing and add daily writer hooks
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_station_daily.py
