name: Publish authorized climate report palette
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/climate-palette.yml']
permissions:
  contents: read
concurrency:
  group: meteo-krosno-ui-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment script
        run: python -m py_compile tools/deploy_climate_palette.py
      - name: Back up and update authorized PHP reports without logging their source
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_climate_palette.py
