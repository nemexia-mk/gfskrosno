name: Deploy dew point and clearer grid
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/temperature-lines.yml']
permissions:
  contents: read
concurrency:
  group: meteo-krosno-ui-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify meteorogram data and rendering
        run: |
          node --check site/app.js
          node tests/test_weather_frontend.cjs
          node tests/test_meteorogram_clouds.cjs
          node tests/test_meteorogram_styles.cjs
      - name: Back up and publish meteorogram
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_temperature_lines.py
