name: Deploy clearer temperature lines and grid
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/temperature-lines.yml']
permissions:
  contents: read
  actions: write
concurrency:
  group: meteo-krosno-ui-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Cancel only the superseded waiting frontend deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          url='https://api.github.com/repos/nemexia-mk/gfskrosno/actions/runs/39847517276'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          run=json.load(urllib.request.urlopen(urllib.request.Request(url,headers=headers)))
          assert run['path']=='.github/workflows/temperature-lines.yml'
          if run['status'] in ('pending','queued'):
              req=urllib.request.Request(url+'/cancel',data=b'',headers=headers,method='POST')
              with urllib.request.urlopen(req) as response: print('Superseded waiting frontend run cancelled',response.status)
          else:
              print('Earlier deployment status:',run['status'])
          PY
      - name: Verify meteorogram data and rendering
        run: |
          node --check site/app.js
          node tests/test_weather_frontend.cjs
          node tests/test_meteorogram_clouds.cjs
          node tests/test_meteorogram_styles.cjs
      - name: Back up and publish meteorogram
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_temperature_lines.py
