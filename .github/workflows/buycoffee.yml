name: Add BuyCoffee support section
on:
  push:
    branches: [main]
    paths: ['.github/workflows/buycoffee.yml', 'site/mu-plugins/mk-buycoffee.php', 'tools/deploy_buycoffee.py']
permissions:
  contents: read
concurrency:
  group: meteo-krosno-public-seo-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: |
          php -l site/mu-plugins/mk-buycoffee.php
          python -m py_compile tools/deploy_buycoffee.py
      - name: Read supplied QR and publish support section with private recovery copy
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_buycoffee.py
      - uses: actions/upload-artifact@v4
        with:
          name: supplied-buycoffee-qr
          path: coffee-artifact/QR_buycoffee.png
          retention-days: 1
      - run: |
          python - <<'PY'
          from urllib.request import urlopen
          with urlopen('https://meteo-krosno.pl/',timeout=45) as r:
              h=r.read().decode()
              assert h.count('id="mk-coffee-support"')==1
              assert all('coffeeSize='+s in h for s in ['small','medium','large'])
          with urlopen('https://meteo-krosno.pl/wp-content/themes/meteo-krosno-modern/assets/qr-buycoffee.png',timeout=30) as r:
              assert r.read().startswith(b'\x89PNG\r\n\x1a\n')
          print('Support links and local QR verified')
          PY
