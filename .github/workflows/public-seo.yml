name: Publish public SEO and curated sitemap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/public-seo.yml', 'site/mu-plugins/mk-public-seo.php', 'tools/deploy_public_seo.py', 'tests/test_public_seo.php']
permissions:
  contents: read
concurrency:
  group: meteo-krosno-public-seo-publish
  cancel-in-progress: false
jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, '[publication]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify HTML, unpublished content and sitemap contracts
        run: |
          php -l site/mu-plugins/mk-public-seo.php
          php tests/test_public_seo.php
          php tests/test_sitemap_cache.php
          node --check site/app.js
          node tests/test_ui_local_time.cjs
          python -m py_compile tools/deploy_public_seo.py
      - name: Back up and publish SEO
        env:
          FTP_HOST: corn.cba.pl
          FTP_USER: nemexia
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_public_seo.py
      - name: Verify public server HTML and sitemaps
        run: python tools/verify_public_seo.py
