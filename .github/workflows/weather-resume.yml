name: Publish verified weather results
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/weather-resume.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: gfs-krosno-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: corn.cba.pl
      FTP_USER: nemexia
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_SITE_ASSETS_DIR: /meteo-krosno.pl/wp-content/themes/meteo-krosno-modern/assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install 'numpy<3' 'pandas<3' 'matplotlib<4' requests xlsxwriter python-dotenv eccodes metpy
      - uses: actions/download-artifact@v4
        with:
          name: weather-deployment-report
          run-id: 39825913675
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Verify retained complete GFS and convection outputs
        run: python tools/verify_weather_outputs.py
      - name: Back up server and deploy Python scripts
        run: python tools/deploy_weather.py prepare
      - name: Publish verified data and regenerate spreadsheet and PNG outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          import gfs_krosno as g
          import gfs_conv as c
          p=next(Path(g.OUTPUT_DIR).glob('gfs_extra_*.json'));extra=json.loads(p.read_text())
          run=pd.Timestamp(extra['run']);rd,rh=run.strftime('%Y%m%d'),run.strftime('%H')
          source=Path(g.OUTPUT_DIR)/f'krosno_gfs_{rd}_{rh}z.csv'
          original=source.read_bytes();df=pd.read_csv(source,parse_dates=['Czas']);df['Date']=df['Czas'].dt.date
          df.attrs['extra_rows']=extra['rows']
          grouped=df.groupby('Date')
          daily=grouped.agg(Tmax=('T2M [°C]','max'),Tmin=('T2M [°C]','min'),Wsp_sred=('WSPD [m/s]','mean'),Pres_sred=('MSLP [hPa]','mean'),CAPE_max=('CAPE [J/kg]','max'),LIFTED_min=('LIFTED [°C]','min'),VIS_min=('VIS [km]','min'),T_mean=('T2M [°C]','mean'),Td_mean=('D2M [°C]','mean'))
          wet=df[df['T+ (h)']>0].copy();wet['Opad_Date']=(wet['Czas']-pd.Timedelta(microseconds=1)).dt.date
          rg=wet.groupby('Opad_Date')
          daily['Suma_opadu']=rg['RRR [mm]'].sum(min_count=1).reindex(daily.index).round(1)
          daily['Opad_dostepne_kroki']=rg['RRR [mm]'].count().reindex(daily.index,fill_value=0)
          daily['Opad_oczekiwane_kroki']=rg.size().reindex(daily.index,fill_value=0)
          daily['Opad_brakujace_wartosci']=daily['Opad_oczekiwane_kroki']-daily['Opad_dostepne_kroki']
          daily['Dostepne_terminy']=grouped.size();daily['Oczekiwane_terminy']=grouped.size();daily['Brakujace_terminy']=0
          daily['PrecType']=rg['Rodzaj opadu'].agg(g.daily_precip_type).reindex(daily.index).fillna('Brak danych')
          daily=daily.reset_index()
          daily['LCL_m']=daily.apply(lambda r:g.lcl_height_m(r['T_mean'],r['Td_mean']),axis=1)
          daily['StormRisk']=daily.apply(lambda r:g.storm_risk_category(r['CAPE_max'],r['LIFTED_min']),axis=1)
          daily['Date_str']=daily['Date'].astype(str)
          generated=g.save_outputs(df,daily,rd,rh)
          source.write_bytes(original)
          assert g.upload_to_ftp(generated,rd,rh)
          conv=c.build_dataframe(df,extra['rows']);files=c.save_outputs(conv,rd,rh)
          c.upload_to_ftp(files,rd,rh)
          PY
      - name: Deploy meteorogram and homepage
        run: python tools/deploy_weather.py site
      - name: Verify published bytes and CSV schema
        run: python tools/deploy_weather.py verify
